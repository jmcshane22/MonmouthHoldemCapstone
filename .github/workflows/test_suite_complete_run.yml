# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
name: Run Complete Test Suite (All Tests) 

on:
  pull_request:
    types: [synchronize, ready_for_review, opened, reopened]
  workflow_dispatch:

jobs:
  # Done as a step and not a workflow job as skipping a step isn't a failure condition,
  # but skipping a job is, but our build workflow skipping is a valid outcome
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone' && github.event.pull_request.draft == false
    steps:
      - name: Build Workflow Call
        uses: ./.github/workflows/build.yml 
    
  limited_test_suite_run:
    needs: build
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone' && github.event.pull_request.draft == false
    uses: ./.github/workflows/test_suite_limited_run.yml

  system_tests:
    needs: build
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone' && github.event.pull_request.draft == false
    uses: ./.github/workflows/system_tests.yml