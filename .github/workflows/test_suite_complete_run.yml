# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
name: Run Complete Test Suite (All Tests) 

on:
  pull_request:
    types: [synchronize, ready_for_review, opened, reopened]
  workflow_dispatch:

jobs:
  check_duplicate_run:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.duplicate_check.outputs.should_skip }}
    steps:
      - id: duplicate_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content' # Skips if the same content already has a run
  
  build:
    needs: check_duplicate_run
    if: >
      needs.check_duplicate_run.outputs.should_skip != 'true' 
      && github.repository == 'jmcshane22/MonmouthHoldemCapstone' 
      && github.event.pull_request.draft == false
    uses: ./.github/workflows/build.yml
    
  limited_test_suite_run:
    needs: [check_duplicate_run,build]
    if: >
      needs.check_duplicate_run.outputs.should_skip != 'true' 
      && github.repository == 'jmcshane22/MonmouthHoldemCapstone' 
      && github.event.pull_request.draft == false
    uses: ./.github/workflows/test_suite_limited_run.yml

  system_tests:
    needs: [check_duplicate_run,build]
    if: >
      needs.check_duplicate_run.outputs.should_skip != 'true' 
      && github.repository == 'jmcshane22/MonmouthHoldemCapstone' 
      && github.event.pull_request.draft == false
    uses: ./.github/workflows/system_tests.yml