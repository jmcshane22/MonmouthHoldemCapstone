# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
name: Fork PR - Sync to Main Repo for Testing

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write  # Required to push sync branch
  actions: write   # Required to dispatch test_suite_complete_run.yml

jobs:
  sync-and-trigger:
    name: Sync Fork Code and Trigger Tests
    if: |
      github.repository == 'jmcshane22/MonmouthHoldemCapstone' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code from fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Push to sync branch in main repo
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git checkout -b pr-sync/pr-${{ github.event.pull_request.number }}
          git push origin pr-sync/pr-${{ github.event.pull_request.number }} --force

      - name: Trigger complete test suite on sync branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test_suite_complete_run.yml',
              ref: 'pr-sync/pr-${{ github.event.pull_request.number }}'
            });

  cleanup:
    name: Delete Sync Branch on PR Close
    if: |
      github.repository == 'jmcshane22/MonmouthHoldemCapstone' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete sync branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/pr-sync/pr-${{ github.event.pull_request.number }}'
              });
              core.notice('Deleted sync branch pr-sync/pr-${{ github.event.pull_request.number }}');
            } catch (e) {
              if (e.status === 422) {
                core.warning('Branch pr-sync/pr-${{ github.event.pull_request.number }} not found, skipping delete.');
              } else {
                throw e;
              }
            }
