# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
name: Run Integration & E2E Tests (System Tests)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Done as a step and not a workflow job as skipping a step isn't a failure condition,
  # but skipping a job is, but our build workflow skipping is a valid outcome
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    steps:
      - name: Build Workflow Call
        uses: ./.github/workflows/build.yml 

  system_tests:
    needs: build
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    environment:
      name: system_testing
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color
      ASPNETCORE_ENVIRONMENT: Acceptance

    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}
          path: ./src

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SYSTEST_AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.SYSTEST_AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.SYSTEST_AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Ensure test database is migrated and ok
        run: |
          chmod +x ./src/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} ./src/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }}
          && ./src/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }} --connection '${{ secrets.SYSTEST_AZUREAPPSERVICE_DBCONNSTR }}' --verbose
          && ./src/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX  }} --connection '${{ secrets.SYSTEST_AZUREAPPSERVICE_DBCONNSTR }}' --verbose
      
      - name: Unit Test with dotnet
        env:
          ConnectionStrings__DataDb: ${{ secrets.SYSTEST_AZUREAPPSERVICE_DBCONNSTR }}
          ConnectionStrings__AzureCommunicationServices: ${{ secrets.SYSTEST_AZURECOMMSERVICE_CONNSTR }}
          Api__External__Ninjas__ApiKey: ${{ secrets.SYSTEST_NINJASAPI_APIKEY }}
        run: | 
          dotnet test ./src/MH.Capstone.Tests.Integration --no-restore --no-build --configuration Release --verbosity normal
          ; dotnet test ./src/MH.Capstone.Tests.Acceptance --no-restore --no-build --configuration Release --verbosity normal