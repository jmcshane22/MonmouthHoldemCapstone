# WARNING: This workflow/action can only be run on the main repo (jmcshane22/MonmouthHoldemCapstone)
name: Run Integration & E2E Tests (System Tests)

on:
  workflow_dispatch:
  workflow_call:

# Only one system-test run may execute at a time — tests share a single Azure SQL database
# and concurrent runs cause data-race failures. cancel-in-progress: false means a second
# run waits in the queue rather than being killed.
permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    uses: ./.github/workflows/build.yml

  system_tests:
    needs: build
    if: github.repository == 'jmcshane22/MonmouthHoldemCapstone'
    runs-on: ubuntu-latest
    permissions:
      actions: read    # Required to download artifact from the source run
      contents: read
    # Throwaway Postgres per run: the acceptance host migrates and seeds it itself.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: waid_systest
          POSTGRES_USER: waid
          POSTGRES_PASSWORD: waid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waid -d waid_systest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    environment: system_testing
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color
      ASPNETCORE_ENVIRONMENT: Acceptance
      Database__Provider: Postgres

    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.sha }}
          run-id: ${{ needs.build.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ./src

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Give execution permissions to entire project build directory
        run: chmod -R +x ./src

      - name: Run Integration & Acceptance (BDD/Gherkin/Reqnroll) Tests
        env:
          ConnectionStrings__DataDb: Host=localhost;Port=5432;Database=waid_systest;Username=waid;Password=waid
          ConnectionStrings__AzureCommunicationServices: ${{ secrets.SYSTEST_AZURECOMMSERVICE_CONNSTR }}
          Api__External__Ninjas__ApiKey: ${{ secrets.SYSTEST_NINJASAPI_APIKEY }}
          Gemini__ApiKey: ${{ secrets.GEMINI_APIKEY }}
        run: |
          ls -a ./src ;
          dotnet test ./src/MH.Capstone.Tests.Integration --no-restore --no-build --configuration Release --verbosity ${{ vars.DOTNET_VERBOSE_LVL }} ;
          dotnet test ./src/MH.Capstone.Tests.Acceptance --no-restore --no-build --configuration Release --verbosity ${{ vars.DOTNET_VERBOSE_LVL }}
