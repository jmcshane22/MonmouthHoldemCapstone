#TODO - Add Jest testing once implemented
name: Run Unit Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # Done as a step and not a workflow job as skipping a step isn't a failure condition,
  # but skipping a job is, but our build workflow skipping is a valid outcome
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Workflow Call
        uses: ./.github/workflows/build.yml 

  unit_tests:
    needs: build
    runs-on: ubuntu-latest
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color

    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}
          path: ./src

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      
      - name: Unit Test with dotnet
        run: | 
          dotnet test ./src/MH.Capstone.WebApp.Tests.Unit --no-restore --no-build --configuration Release --verbosity normal
          ; dotnet test ./src/MH.Capstone.Domain.Tests.Unit --no-restore --no-build --configuration Release --verbosity normal