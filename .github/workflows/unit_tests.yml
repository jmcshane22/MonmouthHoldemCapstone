name: Run Unit Tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  check_duplicate_run:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.duplicate_check.outputs.should_skip }}
    steps:
      - id: duplicate_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content' # Skips if the same content already has a run

  build:
    needs: check_duplicate_run
    if: needs.check_duplicate_run.outputs.should_skip != 'true'
    uses: ./.github/workflows/build.yml

  unit_tests:
    needs: [check_duplicate_run,build]
    if: needs.check_duplicate_run.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color

    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}
          path: ./src

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'
      
      - name: Unit Test with dotnet
        run: | 
          dotnet test ./src/MH.Capstone.WebApp.Tests.Unit --no-restore --no-build --configuration Release --verbosity normal
          ; dotnet test ./src/MH.Capstone.Domain.Tests.Unit --no-restore --no-build --configuration Release --verbosity normal