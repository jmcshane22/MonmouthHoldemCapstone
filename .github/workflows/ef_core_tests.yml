name: EF Core Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  validate_ef:
    name: EF Core Model Migration Validation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Required to download artifact from the source run
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color

    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.sha }}
          run-id: ${{ needs.build.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ./src

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version ${{ vars.DOTNET_EF_VERSION }}

      # Each provider keeps its own migrations project; check both, for both contexts.
      - name: Ensure no missing EF Migrations (all providers, all contexts)
        run: |
          MIGRATION_NAME="__AutoCheck"
          MIGRATION_STARTUP="./src/MH.Capstone.WebApp"
          EXIT_CODE=0
          for PROVIDER in SqlServer Postgres; do
            MIGRATION_PROJ="./src/MH.Capstone.Migrations.${PROVIDER}"
            for MIGRATION_CONTEXT in ApplicationDbContext CacheDbContext; do
              if [ "$MIGRATION_CONTEXT" = "CacheDbContext" ]; then OUT_DIR="Migrations/Cache"; else OUT_DIR="Migrations"; fi
              MIGRATIONS_FOLDER="${MIGRATION_PROJ}/${OUT_DIR}"
              echo "::group::${PROVIDER} / ${MIGRATION_CONTEXT}"
              export Database__Provider="$PROVIDER"
              dotnet ef migrations add $MIGRATION_NAME --no-build --configuration Release -p $MIGRATION_PROJ -s $MIGRATION_STARTUP -c $MIGRATION_CONTEXT -o $OUT_DIR

              # Check if the generated file contains any operations (e.g., migrationBuilder.)
              if grep -q "migrationBuilder\." ${MIGRATIONS_FOLDER}/*_${MIGRATION_NAME}.cs --exclude=*.Designer.cs; then
                echo "⚠️ ${PROVIDER}/${MIGRATION_CONTEXT}: uncommitted model changes detected. Run src/tools/add-migration.sh."
                EXIT_CODE=1
              else
                echo "✅ ${PROVIDER}/${MIGRATION_CONTEXT}: model matches the last migration snapshot."
              fi

              # Restore all modified files from the check, including new, untracked files (clean)
              git restore . && git clean -fd ./src/MH.Capstone.Migrations.*
              echo "::endgroup::"
            done
          done
          exit $EXIT_CODE
