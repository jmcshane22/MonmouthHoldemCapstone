name: Build Solution

on:
  workflow_dispatch:
  workflow_call:

jobs:
  check_for_sha_build_artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from build job
        id: artifact_download
        uses: actions/download-artifact@v7
        with:
          name: ${{ github.sha }}
          path: ./src

  build:
    needs: check_for_sha_build_artifact
    if: failure() # failure of the above jobs means we need to build this commit. If is succeeds, skip this
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
    env:
      # For color output from the dotnet commands. ENVs are scoped to all steps in the job
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm-256color

    steps:
      - uses: actions/checkout@v4

      - name: Get & store version number
        id: release_version
        run: |
          version="$(date +%Y).$(date +%-m).${{ github.run_number }}.${{ github.run_attempt }}"
          echo "$version" > ${{ vars.VERSION_FILE }}
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef --version ${{ vars.DOTNET_EF_VERSION }}  

      - name: Restore with dotnet
        run: dotnet restore ./src --verbosity normal

      - name: Build with dotnet
        run: dotnet build ./src --no-restore --configuration Release --verbosity normal -p:Version=${{ steps.release_version.outputs.version }}    

      - name: Create EF Core bundle - ApplicationDbContext
        if: inputs.deploy
        run: |
          dotnet ef migrations bundle --self-contained --configuration Release --no-build -o "${{ vars.DOTNET_ROOT }}/myapp/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }}" \
          -p ./src/MH.Capstone.Domain -s ./src/MH.Capstone.WebApp -c ApplicationDbContext
          && cp "${{ vars.DOTNET_ROOT }}/myapp/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }}" "./src/${{ vars.DOTNET_EF_BUNDLE_NAME_APPDBCTX }}"

      - name: Create EF Core bundle - CacheDbContext
        if: inputs.deploy
        run: |
          dotnet ef migrations bundle --self-contained --configuration Release --no-build -o "${{ vars.DOTNET_ROOT }}/myapp/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }}" \
          -p ./src/MH.Capstone.Domain -s ./src/MH.Capstone.WebApp -c CacheDbContext
          && cp "${{ vars.DOTNET_ROOT }}/myapp/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }}" "./src/${{ vars.DOTNET_EF_BUNDLE_NAME_CACHEDBCTX }}"

      - name: Upload build artifact (binaries) for other jobs
        id: artifact_upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: ./src