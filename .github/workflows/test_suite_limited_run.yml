name: Run Limited Test Suite

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Done as a step and not a workflow job as skipping a step isn't a failure condition,
  # but skipping a job is, but our build workflow skipping is a valid outcome
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Workflow Call
        uses: ./.github/workflows/build.yml    
    
  validate_ef:
    needs: build
    uses: ./.github/workflows/ef_core_tests.yml

  unit_tests:
    needs: build
    uses: ./.github/workflows/unit_tests.yml